<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Tools · 工具箱</title>
<style>
:root{color-scheme:light;--ink:#202a3b;--muted:#6b7688;--line:#e0e5ec;--blue:#245ee8;--soft:#eef3ff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#f5f7fa;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #91b1f2;outline-offset:2px}a{color:inherit}h1,h2,p{margin:0}.workspace{height:100vh;height:100dvh;display:grid;grid-template-columns:252px minmax(0,1fr)}.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#fff;z-index:30}.brand{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:24px 20px 18px;background:none;border:0}.brand-symbol{display:grid;grid-template-columns:repeat(2,8px);grid-template-rows:repeat(2,8px);gap:3px;padding:10px;background:var(--soft);border-radius:11px}.brand-symbol i{background:var(--blue);border-radius:2px}.brand strong{display:block;font-size:18px;letter-spacing:-.02em}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.filters{padding:0 16px 16px;display:grid;gap:8px}input,select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fafbfd;color:inherit;padding:9px 11px;font-size:13px}.nav-scroll{flex:1;min-height:0;overflow:auto;padding:0 10px 16px}.group-title{font-size:11px;font-weight:600;color:#8993a3;padding:15px 12px 7px;letter-spacing:.06em}.tool-button{display:flex;align-items:center;width:100%;gap:10px;border:0;border-radius:8px;background:transparent;text-align:left;padding:11px 12px;min-height:44px;font-size:13px;line-height:1.5}.tool-button:hover{background:#f4f6fa}.tool-button[aria-current="page"]{background:var(--soft);color:var(--blue);font-weight:650}.tool-dot{width:6px;height:6px;background:#adb7c7;border-radius:50%;flex:0 0 6px}.tool-button[aria-current="page"] .tool-dot{background:var(--blue)}.sidebar-footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.sidebar-footer a{text-decoration:none}.content{min-width:0;min-height:0;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}.toggle{border:1px solid var(--line);background:white;border-radius:8px;display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px}.toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5}.heading{flex:1;min-width:0}h1{font-size:18px;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere}.context{display:flex;gap:8px;align-items:center;margin-top:3px;color:var(--muted);font-size:11px}.context span+span::before{content:"·";margin-right:8px}.open-link{border:1px solid var(--line);border-radius:7px;padding:8px 11px;text-decoration:none;font-size:12px;white-space:nowrap}.open-link:hover{color:var(--blue);border-color:#a6beef}.main-view{flex:1;position:relative;min-height:0;min-width:0}.overview{position:absolute;inset:0;overflow:auto;padding:30px}.overview-intro{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:24px}.overview-intro h2{font-size:23px;font-weight:650;letter-spacing:-.03em}.overview-intro p{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.8}.count{font-size:12px;color:var(--muted);white-space:nowrap;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start}.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:21px;text-align:left;min-height:168px;display:flex;flex-direction:column;align-items:start;transition:border-color .15s,box-shadow .15s}.card:hover{border-color:#aac0ee;box-shadow:0 4px 16px #1e3a5f08}.card small{font-size:11px;color:var(--blue);margin-bottom:10px}.card strong{font-size:15px;margin-bottom:8px}.card p{color:var(--muted);font-size:12px;line-height:1.8}.card .card-end{font-size:10px;color:#8792a4;margin-top:auto;padding-top:14px}.empty{color:var(--muted);font-size:13px;padding:18px 12px;line-height:1.8}.tool-panel{position:absolute;inset:0;background:#fff}.tool-frame{width:100%;height:100%;border:0;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f8fafc;color:var(--muted);font-size:13px;pointer-events:none}.shade{display:none}body.collapsed .workspace{grid-template-columns:0 minmax(0,1fr)}body.collapsed .sidebar{visibility:hidden;overflow:hidden}[hidden]{display:none!important}
@media(max-width:800px){.workspace{grid-template-columns:minmax(0,1fr)}.sidebar{position:fixed;inset:0 auto 0 0;width:280px;max-width:calc(100% - 40px);box-shadow:8px 0 30px #172b4d18;transform:translateX(-105%);transition:transform .2s}.sidebar-open .sidebar{transform:translateX(0)}.sidebar-open .shade{display:block;position:fixed;inset:0;border:0;background:#172b4d55;z-index:25}.topbar{padding:12px;gap:10px;min-height:72px}h1{font-size:15px}.overview{padding:22px 16px}.overview-intro{display:block;margin-bottom:18px}.overview-intro h2{font-size:22px}.count{margin-top:10px}.cards{grid-template-columns:minmax(0,1fr);gap:12px}.card{min-height:140px}.open-link{padding:8px;font-size:11px}body.collapsed .sidebar{visibility:visible}body.collapsed .workspace{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.sidebar,.topbar,.overview,.shade{display:none!important}.workspace{display:block}.content,.main-view,.tool-panel{height:auto;position:static}.tool-panel[hidden]{display:none!important}.tool-frame{height:100vh}}
</style>
</head>
<body>
<div class="workspace">
<aside class="sidebar" aria-label="工具导航"><button class="brand" id="all-tools"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span><strong>工具箱</strong><small>HTML Tools · v__PORTAL_VERSION__</small></span></button>
<div class="filters"><input id="searchInput" type="search" aria-label="搜索工具" placeholder="搜索工具名称或用途"><select id="categorySelect" aria-label="工具分类"><option value="">全部分类</option></select></div>
<nav class="nav-scroll" id="tool-list" aria-label="可用工具"></nav><footer class="sidebar-footer"><span id="available-count"></span><a href="menu-admin" id="manage-link" hidden>菜单管理</a></footer></aside>
<button class="shade" id="shade" aria-label="关闭工具列表"></button>
<section class="content"><header class="topbar"><button class="toggle" id="toggle-nav" aria-label="展开或收起工具列表" aria-controls="tool-list" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M13 9h4M13 13h4"/></svg></button><div class="heading"><h1 id="active-title">全部工具</h1><div class="context"><span id="active-category">统一工作区</span><span id="active-version">选择工具即可使用</span></div></div><a id="open-tool" class="open-link" href="#" target="_blank" rel="noopener" hidden>单独打开 ↗</a></header>
<main class="main-view"><section class="overview" id="overview" aria-label="全部工具"><div class="overview-intro"><div><h2>工具总览</h2><p>选择工具开始使用，来回切换保留当前输入。</p></div><span class="count" id="result-count"></span></div><div class="cards" id="tool-cards"></div></section><div id="panels"></div></main></section>
</div>
<script id="tool-catalog" type="application/json">__TOOLS__</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id),escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const online=/^https?:$/.test(location.protocol),storageKey='html-tools.workspace.v1',panels=new Map();
let tools=JSON.parse($('tool-catalog').textContent),activeId='',query='',category=new URLSearchParams(location.search).get('category')||'';
const valid=t=>t&&typeof t.id==='string'&&typeof t.href==='string'&&t.href.startsWith('tools/')&&!t.href.split('/').includes('..')&&!t.hidden&&t.platforms?.web!==false;
function applyPreferences(items){let prefs={};try{prefs=JSON.parse(localStorage.getItem('html-tools-menu-preferences')||'{}')||{};}catch{}const order=Array.isArray(prefs.order)?prefs.order:[];return items.filter(valid).filter(t=>!prefs.hidden?.[t.id]).sort((a,b)=>{const ai=order.indexOf(a.id),bi=order.indexOf(b.id);return (ai<0?9999:ai)-(bi<0?9999:bi)||(a.order||9999)-(b.order||9999);});}
function list(){const q=query.trim().toLowerCase();return tools.filter(t=>(!category||t.category===category)&&(!q||[t.title,t.description,t.category,...(t.tags||[])].join(' ').toLowerCase().includes(q)));}
function render(){
 const visible=list();let previous='';
 $('tool-list').innerHTML=visible.map(t=>{const group=t.category||'其他工具',heading=group!==previous?`<div class="group-title">${escape(group)}</div>`:'';previous=group;return `${heading}<button class="tool-button" data-tool="${escape(t.id)}" aria-current="${t.id===activeId?'page':'false'}"><span class="tool-dot" aria-hidden="true"></span><span>${escape(t.title)}</span></button>`;}).join('')||'<p class="empty">没有匹配的工具，试试其他关键词。</p>';
 $('tool-cards').innerHTML=visible.map(t=>`<button class="card" data-tool="${escape(t.id)}"><small>${escape(t.category)}</small><strong>${escape(t.title)}</strong><p>${escape(t.description)}</p><span class="card-end">${escape(t.badge)} · v${escape(t.version||'1.0.0')}</span></button>`).join('')||'<p class="empty">没有匹配的工具。</p>';
 $('result-count').textContent=visible.length+' 个工具'+(query||category?' · 已筛选':'');$('available-count').textContent=tools.length+' 个可用工具';
}
function setup(){tools=applyPreferences(tools);const categories=[...new Set(tools.map(t=>t.category||'其他工具'))];$('categorySelect').innerHTML='<option value="">全部分类</option>'+categories.map(c=>`<option value="${escape(c)}">${escape(c)}</option>`).join('');if(!categories.includes(category))category='';$('categorySelect').value=category;render();}
function closeDrawer(){document.body.classList.remove('sidebar-open');syncToggle();}
function syncToggle(){const mobile=matchMedia('(max-width:800px)').matches,open=mobile?document.body.classList.contains('sidebar-open'):!document.body.classList.contains('collapsed');$('toggle-nav').setAttribute('aria-expanded',String(open));const sidebar=document.querySelector('.sidebar');sidebar.inert=!open;sidebar.setAttribute('aria-hidden',String(!open));document.querySelector('.content').inert=mobile&&open;}
function navigate(id){const url=new URL(location.href);url.hash=id?'tool='+encodeURIComponent(id):'all';url.searchParams.delete('category');if(category)url.searchParams.set('category',category);history.pushState(null,'',url);}
function activate(id,updateUrl=false){
 const tool=tools.find(t=>t.id===id);activeId=tool?tool.id:'';
 for(const [key,panel] of panels)panel.hidden=key!==activeId;
 $('overview').hidden=Boolean(tool);$('open-tool').hidden=!tool;
 if(tool){
   $('active-title').textContent=tool.title;$('active-category').textContent=tool.category||'工具';$('active-version').textContent='v'+(tool.version||'1.0.0');
   const path=!online&&typeof tool.localHref==='string'&&tool.localHref.startsWith('file:')?tool.localHref:tool.href;
   const href=new URL(path,document.baseURI).href;$('open-tool').href=href;
   if(!panels.has(id)){
     const panel=document.createElement('section');panel.className='tool-panel';panel.dataset.toolId=id;
     const loading=document.createElement('div');loading.className='loading';loading.textContent='正在打开 '+tool.title+'…';
     const frame=document.createElement('iframe');frame.className='tool-frame';frame.title=tool.title;frame.dataset.toolId=id;frame.allow='fullscreen; screen-wake-lock; clipboard-write';frame.allowFullscreen=true;frame.src=href;
     frame.addEventListener('load',()=>{loading.hidden=true;});panel.append(frame,loading);$('panels').append(panel);panels.set(id,panel);
   }
   document.title=tool.title+' · 工具箱';
 }else{$('active-title').textContent='全部工具';$('active-category').textContent='统一工作区';$('active-version').textContent='选择工具即可使用';document.title='HTML Tools · 工具箱';}
 try{localStorage.setItem(storageKey,JSON.stringify({activeId}));}catch{}
 if(updateUrl)navigate(activeId);render();closeDrawer();
}
function fromUrl(){const hash=location.hash.slice(1);if(hash==='all')return '';const id=new URLSearchParams(hash).get('tool');return id===null?new URLSearchParams(location.search).get('tool'):id;}
function initial(){let id=fromUrl();if(id===null){try{id=JSON.parse(localStorage.getItem(storageKey)||'{}').activeId||'';}catch{id='';}}activate(id);}
$('tool-list').addEventListener('click',e=>{const button=e.target.closest('[data-tool]');if(button)activate(button.dataset.tool,true);});
$('tool-cards').addEventListener('click',e=>{const button=e.target.closest('[data-tool]');if(button)activate(button.dataset.tool,true);});
$('all-tools').addEventListener('click',()=>{query='';category='';$('searchInput').value='';$('categorySelect').value='';activate('',true);});
$('searchInput').addEventListener('input',e=>{query=e.target.value;render();});$('categorySelect').addEventListener('change',e=>{category=e.target.value;render();});
$('toggle-nav').addEventListener('click',()=>{if(matchMedia('(max-width:800px)').matches)document.body.classList.toggle('sidebar-open');else document.body.classList.toggle('collapsed');syncToggle();});
$('shade').addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});window.addEventListener('resize',syncToggle);window.addEventListener('popstate',()=>activate(fromUrl()));
setup();initial();syncToggle();
if(online){$('manage-link').hidden=false;fetch(new URL('api/tools',document.baseURI),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json();}).then(data=>{if(!Array.isArray(data.tools))return;const current=activeId;tools=data.tools;setup();activate(current);}).catch(()=>{});}
})();
</script>
</body></html>
