<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用 SVG 绘制的鹅鹏骑自行车 2D 动画。">
  <title>鹅鹏骑自行车 · SVG 2D 动画</title>
  <script src="/site-nav.js?v=1.0.5" defer></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #152b46;
      --muted: #5b7188;
      --line: #d8e2e7;
      --paper: #fffdf8;
      --cream: #f7f1e5;
      --accent: #ef7848;
      --teal: #25a9a2;
      --blue: #5267d8;
      font-family: "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 8% 8%, #fff7d9 0, #fff7d900 30%),
        linear-gradient(145deg, #edf6f5 0%, #f8eee0 100%);
      color: var(--ink);
    }

    .scene {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 30px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid #d4dedf;
      border-radius: 30px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(43, 61, 68, .16);
    }

    .card::after {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      z-index: 3;
      top: 20px;
      right: 24px;
      left: 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
    }

    .title-block { pointer-events: auto; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 6px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(239,120,72,.13);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .subtitle {
      max-width: 390px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    button,
    input { font: inherit; }

    button {
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid rgba(21,43,70,.18);
      border-radius: 999px;
      background: rgba(255,253,248,.78);
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(21,43,70,.08);
      backdrop-filter: blur(10px);
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    button:hover { border-color: var(--teal); background: #fff; transform: translateY(-1px); }
    button:focus-visible,
    input:focus-visible { outline: 3px solid rgba(37,169,162,.28); outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: .6; transform: none; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(21,43,70,.13);
      border-radius: 999px;
      background: rgba(255,253,248,.7);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      backdrop-filter: blur(10px);
    }

    .speed-control input { width: 78px; accent-color: var(--teal); cursor: pointer; }
    .speed-control output { min-width: 32px; color: var(--ink); font-variant-numeric: tabular-nums; }

    svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1000 / 650;
    }

    .caption {
      position: absolute;
      z-index: 2;
      right: 24px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    .caption .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid rgba(21,43,70,.1);
      border-radius: 999px;
      background: rgba(255,253,248,.72);
      backdrop-filter: blur(9px);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 4px rgba(37,169,162,.13);
    }

    .is-paused .status-dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(239,120,72,.14); }

    /* Motion is intentionally kept on small, named SVG groups so it remains easy to inspect. */
    .motion { animation-duration: 1s; animation-timing-function: linear; animation-iteration-count: infinite; animation-fill-mode: both; }
    .is-paused .motion { animation-play-state: paused !important; }
    .reduced .motion { animation: none !important; }

    .cloud-one { animation-name: cloudOne; animation-timing-function: linear; }
    .cloud-two { animation-name: cloudTwo; animation-timing-function: linear; }
    .road-flow { animation-name: roadFlow; animation-timing-function: linear; }
    .grass-wave { animation-name: grassWave; animation-direction: alternate; animation-timing-function: ease-in-out; }
    .wheel { transform-box: fill-box; transform-origin: center; animation-name: wheelSpin; }
    .pedal { transform-box: fill-box; transform-origin: center; animation-name: wheelSpin; }
    .rider { animation-name: riderBob; animation-direction: alternate; animation-timing-function: ease-in-out; }
    .leg-far,
    .leg-near { transform-box: fill-box; transform-origin: 0 0; animation-direction: alternate; animation-timing-function: ease-in-out; }
    .leg-far { animation-name: legFar; }
    .leg-near { animation-name: legNear; }
    .wing-back,
    .wing-front { transform-box: fill-box; transform-origin: 0 0; animation-direction: alternate; animation-timing-function: ease-in-out; }
    .wing-back { animation-name: wingBack; }
    .wing-front { animation-name: wingFront; }
    .head-bob { animation-name: headBob; animation-direction: alternate; animation-timing-function: ease-in-out; }
    .scarf-tail { animation-name: scarfTail; animation-direction: alternate; animation-timing-function: ease-in-out; }
    .sparkle { animation-name: sparkle; animation-direction: alternate; animation-timing-function: ease-in-out; }

    @keyframes cloudOne { from { transform: translateX(-150px); } to { transform: translateX(1050px); } }
    @keyframes cloudTwo { from { transform: translateX(90px); } to { transform: translateX(-980px); } }
    @keyframes roadFlow { from { transform: translateX(0); } to { transform: translateX(-220px); } }
    @keyframes grassWave { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes wheelSpin { to { transform: rotate(360deg); } }
    @keyframes riderBob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    @keyframes legFar { from { transform: rotate(22deg); } to { transform: rotate(-27deg); } }
    @keyframes legNear { from { transform: rotate(-28deg); } to { transform: rotate(24deg); } }
    @keyframes wingBack { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes wingFront { from { transform: rotate(4deg); } to { transform: rotate(-9deg); } }
    @keyframes headBob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(3px) rotate(2deg); } }
    @keyframes scarfTail { from { transform: rotate(-5deg); } to { transform: rotate(8deg); } }
    @keyframes sparkle { from { opacity: .2; transform: scale(.8); } to { opacity: 1; transform: scale(1.15); } }

    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none !important; }
    }

    @media (max-width: 720px) {
      .scene { width: min(100% - 18px, 1180px); padding-top: 12px; }
      .card { border-radius: 22px; }
      .topbar { position: relative; top: auto; right: auto; left: auto; flex-direction: column; gap: 12px; padding: 16px 15px 0; }
      .controls { align-self: stretch; justify-content: space-between; }
      .speed-control { flex: 1; justify-content: space-between; }
      .speed-control input { flex: 1; max-width: 160px; }
      svg { height: clamp(390px, 112vw, 470px); aspect-ratio: auto; }
      .caption { right: 15px; bottom: 13px; }
      .caption > span:last-child { display: none; }
    }

    @media (max-width: 430px) {
      h1 { font-size: 29px; }
      .subtitle { max-width: 270px; font-size: 12px; }
      .controls { gap: 7px; }
      button { padding-inline: 11px; }
      .speed-control { padding-inline: 9px; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="card" id="card" aria-label="鹅鹏骑自行车 SVG 2D 动画">
      <div class="topbar">
        <div class="title-block">

          <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">

  <noscript>此动画页面需要启用 JavaScript 才能使用暂停、速度和重置控制。</noscript>
  <script>
    (() => {
      const card = document.getElementById('card');
      const toggle = document.getElementById('toggle');
      const speed = document.getElementById('speed');
      const speedValue = document.getElementById('speed-value');
      const reset = document.getElementById('reset');
      const status = document.getElementById('status');
      const motionNodes = [...document.querySelectorAll('.motion[data-duration]')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const formatSpeed = (value) => `${Number(value).toFixed(2).replace(/0+$/, '').replace(/\.$/, '')}×`;

      function updateSpeed() {
        const multiplier = Number(speed.value);
        speedValue.textContent = formatSpeed(multiplier);
        motionNodes.forEach((node) => {
          const baseDuration = Number(node.dataset.duration);
          node.style.animationDuration = `${(baseDuration / multiplier).toFixed(3)}s`;
        });
        updateStatus();
      }

      function updateStatus() {
        if (reducedMotion) {
          status.lastChild.textContent = '已减少动效 · 静态预览';
          return;
        }
        const label = card.classList.contains('is-paused') ? '已暂停' : '正在骑行';
        status.lastChild.textContent = `${label} · ${formatSpeed(speed.value)}`;
      }

      toggle.addEventListener('click', () => {
        const paused = card.classList.toggle('is-paused');
        toggle.textContent = paused ? '继续动画' : '暂停动画';
        toggle.setAttribute('aria-pressed', String(paused));
        updateStatus();
      });

      speed.addEventListener('input', updateSpeed);

      reset.addEventListener('click', () => {
        speed.value = '1';
        card.classList.remove('is-paused');
        toggle.textContent = '暂停动画';
        toggle.setAttribute('aria-pressed', 'false');
        updateSpeed();
      });

      document.addEventListener('keydown', (event) => {
        if (event.code !== 'Space' || /INPUT|BUTTON|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
        event.preventDefault();
        toggle.click();
      });

      if (reducedMotion) {
        card.classList.add('reduced');
        toggle.disabled = true;
        toggle.textContent = '已减少动效';
      }

      updateSpeed();
    })();
  </script>
</body>
</html>
